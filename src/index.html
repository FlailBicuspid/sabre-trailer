<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="stylesheet" href="https://use.typekit.net/khd6uuc.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="header-content">
        <button>Notre boutique</button>
        <img src="img/haeder-image.png" alt="Cover image from sabre" />
      </div>
    </header>

    <!-- parallax paysage -->
    <div class="section-parallax">
      <div class="parallax-container">
        <div class="parallax-into-paysage screen-a">
          <img src="img/asset_ciel_sans_montagne_1_v2.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-b">
          <img src="img/asset_ciel_sans_ciel_1_v2.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-c">
          <img src="img/asset_terre_1.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-d">
          <img src="img/asset_terre_2.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-e">
          <img src="img/asset_terre_3.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-f">
          <img src="img/asset_terre_4.png" alt="" />
        </div>
        <div class="parallax-into-paysage screen-g">
          <img src="img/asset_ciel_eclair_1.png" alt="" />
          <div class="parallax-thunder-right">
            <img src="img/_ECLAIre_1.png" alt="" />
          </div>
          <div class="parallax-thunder-left">
            <img src="img/_ECLAIre_2.png" alt="" />
          </div>
        </div>
        <div class="parallax-into-paysage screen-h">
          <img src="img/asset_cave_petite_1.png" alt="" />
        </div>
      </div>
    </div>
    <!-- side Scroll -->
    <div class="slider-mask">
      <div class="slider-track">
        <div class="screen screen-1">o3fhwkk</div>
        <div class="screen screen-2">o3fhwkk</div>
        <div class="screen screen-3">o3fhwkk</div>
        <div class="screen screen-4">o3fhwkk</div>
        <div class="screen screen-5">o3fhwkk</div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
